<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Kesehatan Remaja</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  #quiz-wrap, #result-screen { max-width: 640px; width: 100%; background: #fff; border-radius: 16px; border: 1px solid #e0ddd6; padding: 2rem; }
  .progress-bar-bg { height: 6px; background: #e0ddd6; border-radius: 99px; margin-bottom: 1.5rem; }
  .progress-bar-fill { height: 6px; background: #1D9E75; border-radius: 99px; transition: width 0.4s ease; }
  .q-badge { font-size: 12px; font-weight: 500; color: #888780; background: #f1efe8; padding: 3px 10px; border-radius: 99px; border: 0.5px solid #d3d1c7; display: inline-block; margin-bottom: 1rem; }
  .q-text { font-size: 16px; font-weight: 500; color: #1a1a18; line-height: 1.6; margin-bottom: 1.5rem; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
  .opt-btn { background: #fff; border: 0.5px solid #b4b2a9; border-radius: 12px; padding: 14px 16px; font-size: 15px; color: #1a1a18; text-align: left; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; line-height: 1.5; display: flex; align-items: flex-start; gap: 10px; font-family: inherit; }
  .opt-btn:hover:not(:disabled) { background: #f1efe8; border-color: #888780; }
  .opt-btn:active:not(:disabled) { transform: scale(0.99); }
  .opt-btn:disabled { cursor: default; }
  .opt-letter { font-size: 12px; font-weight: 500; min-width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .opt-btn.correct { background: #EAF3DE; border-color: #639922; color: #27500A; }
  .opt-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #A32D2D; }
  .opt-btn.reveal-correct { background: #EAF3DE; border-color: #639922; color: #27500A; }
  .feedback-box { border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.6; margin-bottom: 1.5rem; display: none; border: 0.5px solid; }
  .feedback-box.correct { background: #EAF3DE; border-color: #97C459; color: #27500A; }
  .feedback-box.wrong { background: #FCEBEB; border-color: #F09595; color: #791F1F; }
  .feedback-box.show { display: block; }
  .feedback-title { font-weight: 500; font-size: 15px; margin-bottom: 6px; }
  .next-btn { background: #fff; border: 0.5px solid #b4b2a9; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 500; color: #1a1a18; cursor: pointer; transition: background 0.15s; display: none; align-items: center; gap: 6px; font-family: inherit; }
  .next-btn.show { display: inline-flex; }
  .next-btn:hover { background: #f1efe8; }
  #result-screen { display: none; }
  .result-card { background: #fff; border: 0.5px solid #d3d1c7; border-radius: 16px; padding: 2rem 1.5rem; text-align: center; margin-bottom: 1.5rem; }
  .result-score { font-size: 56px; font-weight: 600; color: #1a1a18; line-height: 1; }
  .result-label { font-size: 14px; color: #888780; margin-top: 6px; }
  .result-msg { font-size: 16px; color: #1a1a18; margin-top: 1rem; }
  .recap-title { font-size: 14px; font-weight: 500; color: #888780; margin-bottom: 12px; }
  .recap-item { border: 0.5px solid #d3d1c7; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
  .recap-item .ri-q { font-weight: 500; color: #1a1a18; margin-bottom: 6px; }
  .recap-item .ri-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .ri-tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; flex-shrink: 0; margin-top: 1px; }
  .ri-tag.c { background: #C0DD97; color: #27500A; }
  .ri-tag.w { background: #F7C1C1; color: #791F1F; }
  .ri-ans { color: #1a1a18; }
  .restart-btn { background: #fff; border: 0.5px solid #b4b2a9; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 500; color: #1a1a18; cursor: pointer; transition: background 0.15s; font-family: inherit; margin-top: 1rem; }
  .restart-btn:hover { background: #f1efe8; }
  #intro-screen { max-width: 640px; width: 100%; background: #fff; border-radius: 16px; border: 1px solid #e0ddd6; padding: 2.5rem 2rem; text-align: center; }
  .intro-icon { font-size: 48px; margin-bottom: 1.25rem; }
  .intro-title { font-size: 22px; font-weight: 600; color: #1a1a18; margin-bottom: 0.75rem; }
  .intro-desc { font-size: 15px; color: #5f5e5a; line-height: 1.7; margin-bottom: 0.75rem; }
  .intro-meta { display: flex; justify-content: center; gap: 1.5rem; margin: 1.5rem 0; }
  .intro-meta-item { font-size: 13px; color: #888780; display: flex; align-items: center; gap: 6px; }
  .intro-meta-item span { font-weight: 500; color: #1a1a18; }
  .start-btn { background: #1D9E75; border: none; border-radius: 8px; padding: 12px 32px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; transition: background 0.15s, transform 0.1s; font-family: inherit; margin-top: 0.5rem; }
  .start-btn:hover { background: #0F6E56; }
  .start-btn:active { transform: scale(0.98); }
</style>
</head>
<body>

<div id="intro-screen">
  <div class="intro-icon">🩺</div>
  <div class="intro-title">Quiz Kesehatan Remaja</div>
  <div class="intro-desc">Uji seberapa jauh pemahamanmu tentang gaya hidup sehat — mulai dari bahaya gula, rokok, hingga hipertensi.</div>
  <div class="intro-meta">
    <div class="intro-meta-item">📝 <span>10 soal</span></div>
    <div class="intro-meta-item">✅ <span>Pilihan ganda</span></div>
    <div class="intro-meta-item">💡 <span>Ada penjelasan tiap soal</span></div>
  </div>
  <button class="start-btn" onclick="startQuiz()">Mulai Kuis →</button>
</div>

<div id="quiz-wrap" style="display:none;">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog"></div></div>
  <span class="q-badge" id="q-num">Soal 1 dari 10</span>
  <div class="q-text" id="q-text"></div>
  <div class="options" id="options"></div>
  <div class="feedback-box" id="feedback">
    <div class="feedback-title" id="fb-title"></div>
    <div id="fb-body"></div>
  </div>
  <button class="next-btn" id="next-btn"></button>
</div>

<div id="result-screen">
  <div class="result-card">
    <div class="result-score" id="r-score"></div>
    <div class="result-label">dari 10 soal benar</div>
    <div class="result-msg" id="r-msg"></div>
  </div>
  <div class="recap-title">Rekap jawaban</div>
  <div id="recap-list"></div>
  <button class="restart-btn" onclick="restart()">&#8635; Ulangi quiz</button>
</div>

<script>
const questions = [
  { q: "Raka sering minum minuman manis setiap hari karena merasa masih muda dan aktif. Mana pernyataan yang paling tepat?", opts: [ { text: "Tidak masalah karena tubuh muda bisa menyesuaikan", correct: false, reason: "Usia muda bukan berarti kebal. Kebiasaan buruk sejak remaja justru bisa jadi awal penyakit seperti diabetes yang tidak memandang usia." }, { text: "Tetap berisiko karena konsumsi gula berlebih bisa berdampak jangka panjang", correct: true, reason: "Konsumsi gula berlebih secara terus-menerus meningkatkan risiko obesitas dan diabetes meski di usia muda." }, { text: "Aman selama tidak disertai makanan berlemak", correct: false, reason: "Gula berlebih tetap berisiko menimbulkan diabetes walaupun tanpa lemak." } ] },
  { q: "Pernyataan yang paling tepat tentang rokok dan vape adalah:", opts: [ { text: "Vape lebih aman karena tidak menghasilkan asap", correct: false, reason: "Vape menghasilkan aerosol berisi zat kimia yang tetap berbahaya bagi paru-paru, bukan berarti aman." }, { text: "Rokok dan vape sama-sama bisa menyebabkan ketergantungan", correct: true, reason: "Keduanya mengandung zat adiktif (terutama nikotin) yang memengaruhi otak dan menyebabkan ketergantungan." }, { text: "Vape tidak berbahaya jika tanpa nikotin", correct: false, reason: "Walaupun tanpa nikotin, masih ada bahan kimia lain dalam aerosol vape yang bisa mengiritasi paru-paru." } ] },
  { q: "Manakah pernyataan yang paling tepat tentang hipertensi (tekanan darah tinggi)?", opts: [ { text: "Bisa terjadi tanpa gejala yang jelas", correct: true, reason: "Hipertensi disebut 'silent disease' karena sering tidak terasa, tapi perlahan merusak pembuluh darah dan organ." }, { text: "Selalu menimbulkan gejala seperti pusing", correct: false, reason: "Banyak penderita hipertensi tidak merasakan gejala sama sekali, itulah kenapa disebut penyakit 'diam-diam'." }, { text: "Hanya dialami oleh orang tua", correct: false, reason: "Remaja pun bisa mengalami hipertensi jika memiliki gaya hidup tidak sehat." } ] },
  { q: "Rina tidak merokok, tapi sering berada di dekat orang yang merokok. Pernyataan yang paling tepat?", opts: [ { text: "Aman karena tidak merokok langsung", correct: false, reason: "Perokok pasif tetap berisiko terkena dampak rokok karena asap masuk ke paru-paru dan bisa menyebabkan sesak napas." }, { text: "Aman jika hanya sebentar", correct: false, reason: "Paparan singkat pun tetap memiliki risiko terhadap kesehatan paru-paru." }, { text: "Tetap berisiko karena terpapar asap rokok", correct: true, reason: "Sebagai perokok pasif, Rina tetap berisiko karena asap rokok masuk ke paru-parunya dan bisa menyebabkan sesak napas serta penyakit paru lainnya." } ] },
  { q: "Mengapa konsumsi gula berlebih bisa meningkatkan risiko diabetes?", opts: [ { text: "Scanning langsung merusak organ tubuh", correct: false, reason: "Gula tidak langsung merusak organ. Dampaknya bertahap melalui proses metabolisme, bukan kerusakan instan." }, { text: "Karena gula menyebabkan darah menjadi kental", correct: false, reason: "Darah tidak benar-benar menjadi 'kental'. Yang terjadi adalah kadar gula dalam darah meningkat (hiperglikemia), bukan perubahan kekentalan." }, { text: "Karena gula membuat tubuh bekerja lebih keras memproduksi insulin", correct: true, reason: "Konsumsi gula terus-menerus membuat kadar gula darah naik, sehingga tubuh harus memproduksi lebih banyak insulin. Lama-kelamaan sel jadi kurang peka terhadap insulin (resistensi insulin), dan gula menumpuk di darah — itulah awal diabetes." } ] },
  { q: "Mengapa obesitas dapat meningkatkan risiko penyakit jantung?", opts: [ { text: "Karena lemak tubuh bisa memengaruhi kerja jantung dan pembuluh darah", correct: true, reason: "Lemak berlebih dapat meningkatkan kadar kolesterol jahat dan menumpuk di pembuluh darah, mengganggu aliran darah ke jantung dan meningkatkan risiko penyakit jantung." }, { text: "Karena tubuh menjadi lebih ringan sehingga jantung bekerja lebih cepat", correct: false, reason: "Salah — obesitas justru membuat beban kerja jantung lebih berat, bukan lebih ringan. Jantung harus memompa darah ke massa tubuh yang lebih besar." }, { text: "Karena lemak tidak berpengaruh terhadap organ dalam", correct: false, reason: "Lemak sangat berpengaruh terhadap organ dalam, terutama sistem kardiovaskular. Pernyataan ini justru kebalikan dari kenyataan." } ] },
  { q: "Mengapa konsumsi makanan tinggi garam berlebihan bisa berbahaya?", opts: [ { text: "Garam langsung merusak jantung", correct: false, reason: "Garam tidak langsung merusak jantung. Dampaknya terjadi secara bertahap melalui peningkatan tekanan darah yang dalam jangka panjang membebani jantung." }, { text: "Garam membuat tubuh menahan lebih banyak cairan", correct: true, reason: "Natrium dalam garam membuat tubuh menahan lebih banyak air. Volume darah pun meningkat, tekanan pada pembuluh darah naik (hipertensi), yang jika berlangsung lama bisa merusak pembuluh darah dan meningkatkan risiko penyakit jantung." }, { text: "Garam menyebabkan darah berubah warna", correct: false, reason: "Garam tidak menyebabkan perubahan warna darah. Dampak garam berlebih lebih ke keseimbangan cairan dan tekanan darah." } ] },
  { q: "Apa dampak utama terlalu sering mengonsumsi makanan tinggi lemak jenuh (gorengan)?", opts: [ { text: "Lemak langsung menumpuk di otot", correct: false, reason: "Lemak tidak disimpan di otot, melainkan sebagai jaringan lemak atau menempel di dinding pembuluh darah." }, { text: "Lemak dapat menumpuk di pembuluh darah", correct: true, reason: "Lemak jenuh meningkatkan kolesterol jahat yang menempel di dinding pembuluh darah, mempersempit aliran darah — ini adalah awal dari penyakit jantung." }, { text: "Lemak langsung dibuang tubuh", correct: false, reason: "Tubuh tidak langsung membuang lemak berlebih. Lemak yang tidak terpakai akan disimpan sebagai jaringan lemak di berbagai bagian tubuh." } ] },
  { q: "Mengapa kebiasaan sering minum minuman bersoda bisa meningkatkan risiko obesitas?", opts: [ { text: "Karena soda membuat perut terasa penuh lebih lama", correct: false, reason: "Soda justru tidak membuat kenyang lama karena tidak mengandung serat atau protein yang memperlambat pencernaan." }, { text: "Karena soda langsung berubah menjadi lemak di tubuh", correct: false, reason: "Soda tidak langsung berubah menjadi lemak. Prosesnya melalui metabolisme, di mana kelebihan energi barulah disimpan sebagai lemak." }, { text: "Karena soda mengandung kalori tinggi yang mudah dikonsumsi berlebihan", correct: true, reason: "Soda mengandung gula tinggi yang memberikan banyak kalori tanpa membuat kenyang. Kelebihan energi ini disimpan tubuh sebagai lemak, sehingga meningkatkan risiko obesitas." } ] },
  { q: "Apa dampak utama nikotin dalam rokok terhadap tubuh?", opts: [ { text: "Mempengaruhi otak sehingga menimbulkan ketergantungan", correct: true, reason: "Nikotin bekerja pada sistem saraf otak dengan merangsang pelepasan dopamin (zat yang menimbulkan rasa senang), sehingga membuat seseorang ingin terus menggunakannya dan terjadi ketergantungan." }, { text: "Membantu paru-paru bekerja lebih baik", correct: false, reason: "Nikotin tidak memperbaiki fungsi paru-paru, justru dapat merusak jaringan paru." }, { text: "Membersihkan saluran pernapasan", correct: false, reason: "Rokok membawa zat berbahaya yang mengendap di saluran napas — jauh dari membersihkan, justru sebaliknya." } ] }
];

const letters = ['A','B','C'];
let current = 0, score = 0, answered = false, results = [];

function startQuiz() {
  document.getElementById('intro-screen').style.display = 'none';
  document.getElementById('quiz-wrap').style.display = 'block';
  render();
}

function render() {
  const q = questions[current];
  document.getElementById('q-num').textContent = `Soal ${current+1} dari ${questions.length}`;
  document.getElementById('prog').style.width = `${(current/questions.length)*100}%`;
  document.getElementById('q-text').textContent = q.q;

  const optWrap = document.getElementById('options');
  optWrap.innerHTML = '';
  q.opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${o.text}</span>`;
    btn.onclick = () => select(i);
    optWrap.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback-box';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
}

function select(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const chosen = q.opts[idx];
  const btns = document.querySelectorAll('.opt-btn');

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === idx) btn.classList.add(chosen.correct ? 'correct' : 'wrong');
    else if (q.opts[i].correct) btn.classList.add('reveal-correct');
  });

  const fb = document.getElementById('feedback');
  const fbTitle = document.getElementById('fb-title');
  const fbBody = document.getElementById('fb-body');

  if (chosen.correct) {
    score++;
    fb.className = 'feedback-box correct show';
    fbTitle.textContent = '✓ Jawaban benar!';
    fbBody.textContent = chosen.reason;
    results.push({ q: q.q, correct: true, answer: chosen.text, correctAnswer: chosen.text });
  } else {
    const correctOpt = q.opts.find(o => o.correct);
    fb.className = 'feedback-box wrong show';
    fbTitle.textContent = '✗ Jawaban salah';
    fbBody.innerHTML = `<strong>Penjelasan:</strong> ${chosen.reason}<br><br><strong>Jawaban yang benar:</strong> ${correctOpt.text}`;
    results.push({ q: q.q, correct: false, answer: chosen.text, correctAnswer: correctOpt.text });
  }

  const nextBtn = document.getElementById('next-btn');
  nextBtn.className = 'next-btn show';
  nextBtn.textContent = current < questions.length - 1 ? 'Lanjut ke soal berikutnya →' : 'Lihat hasil →';
}

document.getElementById('next-btn').onclick = function() {
  current++;
  if (current < questions.length) render();
  else showResult();
};

function showResult() {
  document.getElementById('quiz-wrap').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  let namaSiswa = prompt("Kuis Selesai! Masukkan nama kamu untuk menyimpan skor ke database:");
  if (namaSiswa == null || namaSiswa.trim() == "") {
      namaSiswa = "Anonim";
  }

  const DATABASE_URL = "URL_DEPLOY_APPS_SCRIPT_LO_DISINI"; 
  
  fetch(DATABASE_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      quizType: "PTM",
      username: namaSiswa,
      score: score + " / " + questions.length
    })
  })
  .then(() => console.log("Data PTM berhasil dikirim!"))
  .catch(err => console.error("Gagal kirim data:", err));

  document.getElementById('r-score').textContent = score;
  const pct = (score / questions.length) * 100;
  let msg = '';
  if (pct === 100) msg = 'Sempurna! Kamu sangat memahami isu kesehatan ini.';
  else if (pct >= 80) msg = 'Bagus sekali! Pengetahuan kesehatanmu sudah cukup kuat.';
  else if (pct >= 60) msg = 'Cukup baik! Masih ada beberapa hal yang perlu diperdalam.';
  else if (pct >= 40) msg = 'Lumayan, tapi ayo pelajari lebih lanjut tentang kesehatan remaja!';
  else msg = 'Jangan menyerah! Bacalah materi ini kembali dan coba lagi.';
  document.getElementById('r-msg').textContent = msg;

  const recapList = document.getElementById('recap-list');
  recapList.innerHTML = '';
  results.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'recap-item';
    div.innerHTML = `
      <div class="ri-q">Soal ${i+1}: ${r.q}</div>
      <div class="ri-row">
        <span class="ri-tag ${r.correct ? 'c' : 'w'}">${r.correct ? 'Benar' : 'Salah'}</span>
        <span class="ri-ans">Jawaban kamu: ${r.answer}</span>
      </div>
      ${!r.correct ? `<div class="ri-row"><span class="ri-tag c">Benar</span><span class="ri-ans">${r.correctAnswer}</span></div>` : ''}
    `;
    recapList.appendChild(div);
  });
}

function restart() {
  current = 0; score = 0; results = [];
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-wrap').style.display = 'none';
  document.getElementById('intro-screen').style.display = 'block';
}
</script>
</body>
</html>
